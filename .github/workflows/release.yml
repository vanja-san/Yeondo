name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.34)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch all history for changelog

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Version is passed to every step: build and publish --no-build must produce
    # the same binaries, otherwise the artifact version will not match the tag.
    #
    # The runtime identifier and PublishReadyToRun must be identical in restore,
    # build, and publish. The csproj enables PublishReadyToRun for Release, so the
    # restore has to fetch the crossgen2 pack for win-x64; building without the RID
    # leaves it unresolved and publish --no-build then fails with NETSDK1094.
    - name: Restore dependencies
      run: dotnet restore "yeondo-app/yeondo-app.csproj" -r win-x64 -p:PublishReadyToRun=true -p:Version=${{ github.event.inputs.version }}

    - name: Build
      run: dotnet build "yeondo-app/yeondo-app.csproj" -c Release --no-restore -r win-x64 -p:PublishReadyToRun=true -p:Version=${{ github.event.inputs.version }}

    - name: Publish
      run: dotnet publish "yeondo-app/yeondo-app.csproj" -c Release --no-build --no-restore -r win-x64 -p:PublishReadyToRun=true -p:Version=${{ github.event.inputs.version }}

    - name: Verify artifact version
      shell: pwsh
      run: |
        $publishDir = "yeondo-app/bin/Release/net10.0-windows/win-x64/publish"
        $exe = Join-Path $publishDir "Yeondo.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "Yeondo.exe not found in $publishDir"
          exit 1
        }

        $expected = "${{ github.event.inputs.version }}"
        $actual = (Get-Item $exe).VersionInfo.FileVersion
        Write-Host "Expected file version: $expected"
        Write-Host "Actual file version:   $actual"

        # FileVersion дополняется нулями до четырёх частей (например 1.2.3 -> 1.2.3.0)
        $expectedFull = $expected
        while (($expectedFull -split '\.').Count -lt 4) { $expectedFull = "$expectedFull.0" }

        if ($actual -ne $expectedFull) {
          Write-Error "Version mismatch: expected $expectedFull, got $actual"
          exit 1
        }
        Write-Host "Version verified: $actual"

    - name: Create Release Archive
      shell: pwsh
      run: |
        $publishDir = "yeondo-app/bin/Release/net10.0-windows/win-x64/publish"
        $zipName = "Yeondo-${{ github.event.inputs.version }}.zip"

        Compress-Archive -Path "$publishDir\*" -DestinationPath "$zipName" -Force

        New-Item -ItemType Directory -Force -Path "release"

        Move-Item -Path "$zipName" -Destination "release/$zipName" -Force

        Copy-Item -Path "README.md" -Destination "release/" -Force

        # Apache-2.0 требует отправлять текст лицензии и NOTICE с каждым релизом.
        Copy-Item -Path "LICENSE" -Destination "release/" -Force
        Copy-Item -Path "NOTICE" -Destination "release/" -Force

        Write-Host "Created: $zipName"
        Write-Host "Files in release folder:"
        Get-ChildItem -Path "release" | ForEach-Object { Write-Host "  - $($_.Name)" }

    - name: Get Previous Tag
      id: previous_tag
      shell: pwsh
      run: |
        $currentTag = "v${{ github.event.inputs.version }}"
        # HEAD^ не существует на самом первом коммите, поэтому stderr скрываем и
        # результат обрезаем: пробелы испортили бы диапазон "$previousTag..HEAD".
        $previousTag = (git describe --tags --abbrev=0 HEAD^ 2>$null | Out-String).Trim()
        if ($previousTag) {
          Write-Host "Previous tag: $previousTag"
          echo "tag=$previousTag" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "No previous tag found, will use all commits"
          echo "tag=" >> $env:GITHUB_OUTPUT
        }

    - name: Generate Changelog
      id: changelog
      shell: pwsh
      run: |
        $currentTag = "v${{ github.event.inputs.version }}"
        $previousTag = "${{ steps.previous_tag.outputs.tag }}"
        
        if ($previousTag) {
          Write-Host "Generating changelog from $previousTag to $currentTag"
          $changelog = git log "$previousTag..HEAD" --pretty=format:"- %s (%h)" --reverse | Out-String
        } else {
          Write-Host "Generating changelog for all commits"
          $changelog = git log --pretty=format:"- %s (%h)" --reverse | Out-String
        }
        
        # Escape special characters for GitHub Actions output
        $changelog = $changelog -replace '%', '%25' -replace '`n', '%0A'
        
        echo "changelog<<EOF" >> $env:GITHUB_OUTPUT
        echo $changelog >> $env:GITHUB_OUTPUT
        echo "EOF" >> $env:GITHUB_OUTPUT

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        files: release/Yeondo-${{ github.event.inputs.version }}.zip
        tag_name: v${{ github.event.inputs.version }}
        name: Yeondo v${{ github.event.inputs.version }}
        body: |
          ## Changes since ${{ steps.previous_tag.outputs.tag || 'initial release' }}

          ${{ steps.changelog.outputs.changelog }}

          ---
          ## License

          Yeondo is free and open source, released under the **Apache License 2.0**
          (SPDX: `Apache-2.0`). The full license text and the `NOTICE` file are included
          in the archive.

          Contributions are welcome. You may use, modify, and redistribute this software
          in commercial or closed-source products; no copyleft obligation applies.

          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.previous_tag.outputs.tag || '' }}...v${{ github.event.inputs.version }}
        draft: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifact (optional)
      uses: actions/upload-artifact@v7
      with:
        name: Yeondo-${{ github.event.inputs.version }}
        path: yeondo-app/bin/Release/net10.0-windows/win-x64/publish/
        retention-days: 30
