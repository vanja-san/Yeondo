name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Только чтение: CI не создаёт релизы и не коммитит ничего.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # Restore requires -r win-x64 because Release sets RuntimeIdentifier, otherwise
    # publishing fails with NETSDK1047. It also requires -p:PublishReadyToRun=true:
    # restore runs under the default Debug configuration, where the csproj does not
    # enable PublishReadyToRun, so without this flag the crossgen2 pack is never
    # fetched and a later Release publish fails with NETSDK1094 on a cold cache.
    - name: Restore
      run: dotnet restore "yeondo-app.slnx" -r win-x64 -p:PublishReadyToRun=true

    # --no-incremental is mandatory: otherwise MSBuild may reuse stale artifacts and
    # miss a real defect in code that was just changed.
    - name: Build Debug
      run: dotnet build "yeondo-app/yeondo-app.csproj" -c Debug --no-restore --no-incremental

    - name: Build Release
      run: dotnet build "yeondo-app/yeondo-app.csproj" -c Release --no-restore --no-incremental -r win-x64 -p:PublishReadyToRun=true

    - name: Test
      run: dotnet test "yeondo-app.Tests/yeondo-app.Tests.csproj" -c Debug --no-restore

    # Wipe the publish directory first, otherwise the localization check reads files
    # from an earlier publish and reports success where the current build omitted them.
    # The RID and PublishReadyToRun flags must match the restore above.
    - name: Publish Release
      shell: pwsh
      run: |
        $publishDir = "yeondo-app/bin/Release/net10.0-windows/win-x64/publish"
        if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
        dotnet publish "yeondo-app/yeondo-app.csproj" -c Release --no-restore --nologo -r win-x64 -p:PublishReadyToRun=true
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Translation files must reach the publish output, otherwise the application
    # starts with built-in English text and user translations are lost.
    - name: Verify localization files are published
      shell: pwsh
      run: |
        $publishDir = "yeondo-app/bin/Release/net10.0-windows/win-x64/publish"
        $expected = @("en.json", "ru.json")
        foreach ($name in $expected) {
          $path = Join-Path $publishDir "i18n/$name"
          if (-not (Test-Path $path)) {
            Write-Error "Missing translation file: $path"
            exit 1
          }
          try {
            Get-Content $path -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          } catch {
            Write-Error "Invalid JSON in $path : $($_.Exception.Message)"
            exit 1
          }
          Write-Host "OK: $name"
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: Yeondo-ci-${{ github.sha }}
        path: yeondo-app/bin/Release/net10.0-windows/win-x64/publish/
        retention-days: 14
